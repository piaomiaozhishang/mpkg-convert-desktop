# Gradle 构建参数（见《02 · 架构与目录结构》第 6 节）。
#
# 注意：这里**不能**加 -Dfile.encoding=UTF-8。
# 项目路径含中文（mpkg转换windows端），而 Gradle 在 Windows 上通过 @argfile 传递测试
# 进程的 classpath：守护进程按自己的默认字符集写文件，java 启动器按系统本地字符集读回。
# 一旦把守护进程的默认字符集改成 UTF-8，而系统本地字符集是本机 ACP=936(GBK)，classpath
# 里的中文路径会被读成乱码，测试类全部 ClassNotFoundException。
# 保持跟随系统字符集（GBK）反而正确；Kotlin 源文件始终按 UTF-8 读取，不受此影响。
org.gradle.jvmargs=-Xmx2g
org.gradle.parallel=true
org.gradle.caching=true
kotlin.code.style=official
